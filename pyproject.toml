[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosafety-replayops"
version = "0.2.0"
description = "Deterministic synthetic fixtures and hard-gate scoring for agentic biosafety safeguard routing."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
    "biosafety",
    "ai-safety",
    "agentic-evaluation",
    "safeguard-routing",
    "prompt-injection",
    "replay-ledger",
    "synthetic-data",
]
authors = [
    { name = "JangKeun Kim" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jang1563/biosafety-replayops-mini-track"
Repository = "https://github.com/jang1563/biosafety-replayops-mini-track"
Dataset = "https://huggingface.co/datasets/jang1563/biosafety-replayops-mini-track"
Issues = "https://github.com/jang1563/biosafety-replayops-mini-track/issues"
Changelog = "https://github.com/jang1563/biosafety-replayops-mini-track/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "huggingface-hub>=1.8,<2",
    "pytest>=9.0,<10",
    "ruff>=0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]
