name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and public-release gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lock and lint
        run: |
          uv lock --check
          uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Dependency-free self-check
        run: PYTHONPATH=src uv run python scripts/run_replayops_selfcheck.py

      - name: Validate public tree and history
        run: |
          uv run python scripts/check_public_manifest.py
          uv run python scripts/check_public_history.py

      - name: Build and validate Hugging Face staging
        run: |
          uv run python scripts/build_hf_release.py --output "$RUNNER_TEMP/replayops-hf" --force
          uv run python scripts/validate_hf_release.py "$RUNNER_TEMP/replayops-hf"

      - name: Build wheel and source archive
        run: uv build

      - name: Verify tracked files stayed unchanged
        run: git diff --exit-code
